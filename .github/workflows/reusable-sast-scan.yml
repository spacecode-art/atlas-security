name: Reusable - SAST Scan (Semgrep)

on:
  workflow_call:
    inputs:
      directory:
        description: "Path to scan"
        type: string
        default: "."
      config:
        description: "Semgrep ruleset(s) — registry config (e.g. p/ci, p/owasp-top-ten) or a local path"
        type: string
        default: "p/ci"
      semgrep-version:
        description: "Pinned Semgrep version — single source of truth, do not override per-consumer"
        type: string
        default: "1.99.0"
      fail-on-findings:
        description: "Hard-fail the calling workflow if Semgrep reports any finding — defaults soft during initial rollout to establish a baseline before gating (see ADR, pending)"
        type: boolean
        default: false
    secrets:
      ingest-token:
        description: "PAT with permission to dispatch to spacecode-art/atlas-security. Optional — dashboard ingestion (ADR-0006) is skipped if unset."
        required: false

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consuming repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Semgrep
        run: pip install "semgrep==${{ inputs.semgrep-version }}"

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config "${{ inputs.config }}" \
            --sarif --output semgrep-results.sarif \
            "${{ inputs.directory }}"

          # --error is a separate, deliberate second pass: semgrep scan
          # exits 0 by default regardless of findings, so the fail/don't
          # -fail decision has to be an explicit branch, not a flag we
          # can conditionally interpolate into one command.
          if [ "${{ inputs.fail-on-findings }}" = "true" ]; then
            semgrep scan --config "${{ inputs.config }}" "${{ inputs.directory }}" --error
          fi

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: semgrep-results
          path: semgrep-results.sarif
          retention-days: 30

      - name: Report to dashboard
        if: always() && hashFiles('semgrep-results.sarif') != ''
        continue-on-error: true
        env:
          INGEST_TOKEN: ${{ secrets.ingest-token }}
        run: |
          if [ -z "$INGEST_TOKEN" ]; then
            echo "No ingest-token secret — skipping dashboard dispatch (ADR-0006)."
            exit 0
          fi
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          jq -n --arg tool semgrep --arg repo "$REPO_NAME" \
            --slurpfile findings semgrep-results.sarif \
            '{event_type:"scan-result", client_payload:{tool:$tool, repo:$repo, findings:$findings[0]}}' \
            > dispatch.json
          curl -sS -f -X POST \
            -H "Authorization: token $INGEST_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/spacecode-art/atlas-security/dispatches \
            -d @dispatch.json