name: Reusable - SBOM, Vulnerability Scan, Sign

on:
  workflow_call:
    inputs:
      image-name:
        description: "Full image ref to build and scan, e.g. ghcr.io/spacecode-art/tawira"
        type: string
        required: true
      image-tag:
        description: "Tag for the built image"
        type: string
        default: ${{ github.sha }}
      dockerfile:
        description: "Path to the Dockerfile to build"
        type: string
        default: "Dockerfile"
      context:
        description: "Build context path"
        type: string
        default: "."
      build-args:
        description: |
          Newline-separated --build-arg entries. Client-safe values only —
          never pass a secret here, it lands in image build logs. Runtime
          secrets belong in the orchestrator's own secret manager, not this
          input (see Tawira's Dockerfile comment on VITE_* vs
          SUPABASE_SERVICE_ROLE_KEY/BREVO_API_KEY).
        type: string
        default: ""
      fail-on-severity:
        description: "Grype hard-fail threshold: negligible, low, medium, high, or critical"
        type: string
        default: "critical"
      syft-version:
        description: "Pinned Syft version — single source of truth, do not override per-consumer"
        type: string
        default: "1.18.0"
      grype-version:
        description: "Pinned Grype version — single source of truth, do not override per-consumer"
        type: string
        default: "0.85.0"
      cosign-version:
        description: "Pinned Cosign version — single source of truth, do not override per-consumer"
        type: string
        default: "2.4.1"
    secrets:
      registry-username:
        required: true
      registry-password:
        required: true
      ingest-token:
        description: "PAT with permission to dispatch to spacecode-art/atlas-security. Optional — dashboard ingestion (ADR-0006) is skipped if unset."
        required: false

jobs:
  build-scan-sign:
    name: Build, SBOM, Scan, Sign
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # required for Cosign keyless (OIDC) signing

    steps:
      - name: Checkout consuming repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Log in to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ secrets.registry-username }}
          password: ${{ secrets.registry-password }}

      - name: Build image
        run: |
          docker build \
            -f "${{ inputs.dockerfile }}" \
            -t "${{ inputs.image-name }}:${{ inputs.image-tag }}" \
            $(echo "${{ inputs.build-args }}" | sed '/^\s*$/d' | sed 's/^/--build-arg /') \
            "${{ inputs.context }}"

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin v${{ inputs.syft-version }}

      - name: Generate SBOM
        run: |
          syft "${{ inputs.image-name }}:${{ inputs.image-tag }}" \
            -o spdx-json="sbom-${{ inputs.image-tag }}.spdx.json"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sbom-${{ inputs.image-tag }}
          path: sbom-${{ inputs.image-tag }}.spdx.json
          retention-days: 30   # SBOMs are the evidence — kept longer than plan artifacts

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b /usr/local/bin v${{ inputs.grype-version }}

      - name: Scan SBOM for vulnerabilities
        run: |
          grype "sbom:sbom-${{ inputs.image-tag }}.spdx.json" \
            --fail-on "${{ inputs.fail-on-severity }}" \
            -o table

      - name: Re-run Grype for JSON (dashboard ingestion only)
        # Separate from the fail-on gate above — this never affects
        # whether the image gets pushed, only whether a data point
        # reaches the dashboard. See ADR-0006.
        if: always()
        continue-on-error: true
        run: |
          grype "sbom:sbom-${{ inputs.image-tag }}.spdx.json" -o json > grype-results.json || true

      - name: Report to dashboard
        if: always() && hashFiles('grype-results.json') != ''
        continue-on-error: true
        env:
          INGEST_TOKEN: ${{ secrets.ingest-token }}
        run: |
          if [ -z "$INGEST_TOKEN" ]; then
            echo "No ingest-token secret — skipping dashboard dispatch (ADR-0006)."
            exit 0
          fi
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          jq '{matches: [.matches[]? | {vulnerability: {severity: .vulnerability.severity}}]}' \
            grype-results.json > grype-dispatch-findings.json
          jq -n --arg tool grype --arg repo "$REPO_NAME" \
            --slurpfile findings grype-dispatch-findings.json \
            '{event_type:"scan-result", client_payload:{tool:$tool, repo:$repo, findings:$findings[0]}}' \
            > dispatch.json
          curl -sS -f -X POST \
            -H "Authorization: token $INGEST_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/spacecode-art/atlas-security/dispatches \
            -d @dispatch.json

      - name: Push image
        # Only pushed after Grype passes — an image with a hard-fail
        # finding never reaches the registry, let alone gets signed.
        run: docker push "${{ inputs.image-name }}:${{ inputs.image-tag }}"

      - name: Resolve pushed digest
        # Sign by immutable digest, not the mutable tag — a tag could
        # in principle be repointed between push and sign, which would
        # make the signature attest to the wrong image. See ADR.
        id: digest
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' \
            "${{ inputs.image-name }}:${{ inputs.image-tag }}")
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: "v${{ inputs.cosign-version }}"

      - name: Sign image (keyless, OIDC)
        # Keyless signing over a long-lived key — no private key to
        # rotate, leak, or store as a repo secret. Identity is this
        # workflow run itself, verifiable via rekor's transparency log.
        run: cosign sign --yes "${{ steps.digest.outputs.digest }}"