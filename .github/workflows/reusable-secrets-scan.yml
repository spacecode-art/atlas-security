name: Reusable - Secrets Scan

on:
  workflow_call:
    inputs:
      fail-on-findings:
        description: "Hard-fail the calling workflow if secrets are found"
        type: boolean
        default: true
    secrets:
      ingest-token:
        description: "PAT with permission to dispatch to spacecode-art/atlas-security. Optional — dashboard ingestion (ADR-0006) is skipped if unset."
        required: false

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # gitleaks-action comments on the PR when it finds a leak
    steps:
      - name: Checkout consuming repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0   # full history — Gitleaks scans commits, not just the working tree

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        # gitleaks-action@v2 takes no `with:` inputs — it has never had
        # a `fail` toggle; that was carried over from a different
        # gitleaks wrapper action by mistake. The action always exits
        # non-zero on a finding, so fail-on-findings is honored via
        # continue-on-error at the step level instead.
        continue-on-error: ${{ !inputs.fail-on-findings }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - name: Re-run Gitleaks for a redacted count (dashboard ingestion only)
        # Deliberately never sends the raw gitleaks report cross-repo:
        # it contains the actual matched secret text. This step keeps
        # only the finding *count* and discards everything else before
        # anything leaves the runner. See ADR-0006.
        if: always()
        continue-on-error: true
        run: |
          curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/install.sh | sh -s -- -b /usr/local/bin
          gitleaks detect --report-format json --report-path /tmp/gitleaks-raw.json --exit-code 0 --no-git || true
          COUNT=$(jq 'length' /tmp/gitleaks-raw.json 2>/dev/null || echo 0)
          jq -n --argjson n "$COUNT" '[range($n) | {}]' > gitleaks-results.json
          rm -f /tmp/gitleaks-raw.json

      - name: Report to dashboard
        if: always() && hashFiles('gitleaks-results.json') != ''
        continue-on-error: true
        env:
          INGEST_TOKEN: ${{ secrets.ingest-token }}
        run: |
          if [ -z "$INGEST_TOKEN" ]; then
            echo "No ingest-token secret — skipping dashboard dispatch (ADR-0006)."
            exit 0
          fi
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          jq -n --arg tool gitleaks --arg repo "$REPO_NAME" \
            --slurpfile findings gitleaks-results.json \
            '{event_type:"scan-result", client_payload:{tool:$tool, repo:$repo, findings:$findings[0]}}' \
            > dispatch.json
          curl -sS -f -X POST \
            -H "Authorization: token $INGEST_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/spacecode-art/atlas-security/dispatches \
            -d @dispatch.json