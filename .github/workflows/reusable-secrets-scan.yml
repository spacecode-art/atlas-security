name: Reusable - Secrets Scan

on:
  workflow_call:
    inputs:
      fail-on-findings:
        description: "Hard-fail the calling workflow if secrets are found"
        type: boolean
        default: true

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consuming repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — Gitleaks scans commits, not just the working tree

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
        with:
          fail: ${{ inputs.fail-on-findings }}